<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de Stored Procedures · Flujo de Datos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Configuración compartida de conexión a la API -->
    <script src="Funciones/config.js"></script>

    <style>
        /* =========================================================================
           🎨 PALETA COMITÉ DE NEGOCIOS (Pantone Blue & Grey)
           ========================================================================= */
        :root {
            --color-header-bg: #353A4C;
            --color-header-gradient: linear-gradient(135deg, #353A4C 0%, #3C3F4A 100%);
            --color-header-text: #FFFFFF;
            --color-header-subtext: #C6D2E0;
            --color-heading: #353A4C;
            --color-text: #3C3F4A;
            --color-text-muted: #656466;
            --color-primary: #5A77A8;
            --color-secondary: #748CAB;
            --color-accent: #5A77A8;
            --color-bg: #F4F6F9;
            --color-surface: #FFFFFF;
            --color-border: #E2E8F0;
            --color-slate-light: #91A6C4;
            --color-ice: #C6D2E0;
            --color-ok: #2F855A;
            --color-warn: #B7791F;
            --color-error: #C0392B;
            --shadow-sm: 0 2px 6px rgba(53, 58, 76, 0.06);
            --shadow-md: 0 6px 16px rgba(53, 58, 76, 0.11);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--color-bg);
            color: var(--color-text);
            line-height: 1.4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.92em;
        }

        /* ============================ BARRA DE CONTROLES ============================ */
        .toolbar {
            background: var(--color-surface);
            border-bottom: 2px solid var(--color-secondary);
            padding: 10px 22px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-wrap: wrap;
        }

        .badge-sp {
            background: var(--color-header-bg);
            color: var(--color-header-text);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.78rem;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid var(--color-primary);
            white-space: nowrap;
        }

        .toolbar-title {
            font-weight: 700;
            font-size: 0.92rem;
            color: var(--color-heading);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-width: 0;
        }

        .estado-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.74rem;
            font-weight: 600;
            color: var(--color-text-muted);
            padding: 4px 9px;
            border-radius: 999px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            white-space: nowrap;
        }

        .estado-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-slate-light);
            flex-shrink: 0;
        }

        .estado-dot.ok { background: var(--color-ok); }
        .estado-dot.warn { background: var(--color-warn); }
        .estado-dot.error { background: var(--color-error); }
        .estado-dot.loading { background: var(--color-primary); animation: pulso 1s infinite alternate; }

        @keyframes pulso {
            from { opacity: 0.35; }
            to { opacity: 1; }
        }

        .toolbar-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .toolbar-sep {
            width: 1px;
            height: 20px;
            background: var(--color-border);
            margin: 0 3px;
        }

        .btn {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            color: var(--color-heading);
            padding: 6px 11px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--color-primary);
            background: var(--color-bg);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.active {
            background: var(--color-primary);
            border-color: var(--color-primary);
            color: #FFFFFF;
            font-weight: 700;
        }

        .btn-dark {
            background: var(--color-header-bg);
            color: #FFFFFF;
            border-color: var(--color-header-bg);
        }

        .btn-dark:hover {
            background: var(--color-primary);
            border-color: var(--color-primary);
        }

        .btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .zoom-indicator {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.76rem;
            font-weight: 700;
            padding: 5px 8px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 6px;
            min-width: 52px;
            text-align: center;
            color: var(--color-heading);
        }

        .aviso {
            display: none;
            margin: 12px 22px 0;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid rgba(183, 121, 31, 0.35);
            background: rgba(183, 121, 31, 0.08);
            color: #7B5414;
        }

        .aviso.visible {
            display: block;
        }

        /* ============================ LIENZO ============================ */
        .viewport {
            flex: 1;
            overflow: auto;
            padding: 22px;
            min-width: 0;
        }

        /* Contenedor que reserva el tamaño escalado (el zoom usa transform) */
        .sheet-wrap {
            position: relative;
            margin: 0 auto;
        }

        .diagram-sheet {
            width: max-content;
            background: var(--color-bg);
            transform-origin: top left;
            position: absolute;
            top: 0;
            left: 0;
        }

        .sheet-header {
            background: var(--color-header-gradient);
            color: var(--color-header-text);
            padding: 22px 30px;
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-md);
            border-bottom: 4px solid var(--color-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .sheet-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            color: var(--color-header-text);
            letter-spacing: -0.02em;
            line-height: 1.15;
        }

        .sheet-header p {
            color: var(--color-header-subtext);
            font-size: 0.94rem;
            font-weight: 500;
            margin-top: 6px;
        }

        .header-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .header-pill {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--color-secondary);
            color: var(--color-header-subtext);
            padding: 7px 13px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .header-fecha {
            font-size: 0.72rem;
            color: var(--color-header-subtext);
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.85;
        }

        /* Tablero de 4 etapas (5 columnas: fuentes, transformación, nodo central, catálogos, salida) */
        .board {
            position: relative;
            display: grid;
            grid-template-columns: 360px 320px 190px 290px 215px;
            grid-template-rows: auto auto;
            column-gap: 64px;
            row-gap: 22px;
            align-items: start;
        }

        .connectors-svg {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
            overflow: visible;
        }

        /* Capa superior: flechas internas dentro de las tarjetas */
        .connectors-svg.frente {
            z-index: 7;
        }

        .sec-header {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 5;
            position: relative;
            transition: opacity 0.2s ease;
            min-width: 0;
        }

        .sec-header.s1 { grid-column: 1; }
        .sec-header.s2 { grid-column: 2 / span 2; }
        .sec-header.s3 { grid-column: 4 / span 2; }

        .sec-icon {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: var(--color-bg);
        }

        .sec-header h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--color-heading);
            line-height: 1.22;
            background: var(--color-bg);
            padding-right: 8px;
        }

        .col {
            display: flex;
            flex-direction: column;
            gap: 30px;
            min-width: 0;
            position: relative;
            z-index: 5;
        }

        .col-hub {
            align-self: stretch;
            justify-content: center;
        }

        .node-card {
            background: var(--color-surface);
            border: 1.5px solid var(--color-ice);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: opacity 0.2s ease, box-shadow 0.15s ease, border-color 0.15s ease;
            min-width: 0;
        }

        .node-card:hover {
            border-color: var(--color-primary);
            box-shadow: var(--shadow-md);
        }

        .dimmed {
            opacity: 0.22 !important;
        }

        .card-head {
            padding: 9px 15px;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: -0.01em;
            line-height: 1.25;
            background: var(--color-header-bg);
            color: #FFFFFF;
            word-break: break-word;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        .card-head.primary { background: var(--color-primary); }
        .card-head.secondary { background: var(--color-secondary); font-size: 0.92rem; }
        .card-head.dark { background: var(--color-header-bg); }

        .card-body {
            padding: 12px 15px;
            font-size: 0.84rem;
            color: var(--color-text);
        }

        .col-list,
        .bullet-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .col-list {
            font-weight: 500;
        }

        .bullet-list {
            padding-left: 10px;
            font-size: 0.82rem;
        }

        .col-list li::before,
        .bullet-list li::before {
            content: "• ";
            font-weight: 800;
            color: var(--color-primary);
        }

        .sub-block {
            margin-bottom: 9px;
        }

        .sub-block:last-child {
            margin-bottom: 0;
        }

        .sub-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-weight: 800;
            font-size: 0.85rem;
            color: var(--color-heading);
            margin-bottom: 3px;
        }

        .dash-accent {
            display: inline-block;
            width: 14px;
            height: 4px;
            background: var(--color-primary);
            border-radius: 2px;
            flex-shrink: 0;
        }

        /* Etiqueta de JOIN entre tarjetas de la etapa 1 (la línea pasa por debajo) */
        .join-label {
            align-self: center;
            max-width: 92%;
            margin: -12px 0;
            font-size: 0.76rem;
            font-weight: 600;
            color: var(--color-heading);
            line-height: 1.25;
            background: var(--color-bg);
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid var(--color-ice);
            text-align: center;
            position: relative;
            z-index: 6;
        }

        /* Nodo central (saldos / cascada / FIFO) */
        .balance-node {
            background: var(--color-surface);
            border: 2px solid var(--color-primary);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
            box-shadow: var(--shadow-sm);
            transition: opacity 0.2s ease, border-color 0.15s ease;
        }

        .balance-node:hover {
            border-color: var(--color-heading);
            box-shadow: var(--shadow-md);
        }

        .balance-node h4 {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--color-heading);
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .balance-node p {
            font-size: 0.76rem;
            color: var(--color-text-muted);
            line-height: 1.3;
        }

        .formula-pill {
            margin-top: 8px;
            background: var(--color-bg);
            border: 1px solid var(--color-ice);
            border-radius: 6px;
            padding: 6px 7px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--color-heading);
            line-height: 1.4;
            text-align: left;
        }

        /* Catálogos */
        .cat-paso {
            margin-bottom: 14px;
        }

        .cat-paso:last-child {
            margin-bottom: 0;
        }

        .cat-box {
            border: 1.5px solid var(--color-secondary);
            border-radius: 8px;
            padding: 7px 12px;
            font-weight: 700;
            font-size: 0.88rem;
            color: var(--color-heading);
            background: #F8FAFC;
            word-break: break-word;
        }

        .cat-join-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--color-text);
            padding: 5px 0 3px 34px;
            line-height: 1.32;
        }

        .join-tag {
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--color-primary);
            padding-left: 34px;
        }

        .niveles-list {
            margin-top: 16px;
            border-top: 1px dashed var(--color-ice);
            padding-top: 12px;
        }

        .niveles-list h5 {
            font-size: 0.78rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--color-secondary);
            letter-spacing: 0.04em;
            margin-bottom: 8px;
        }

        .nivel-badge {
            display: block;
            background: var(--color-bg);
            border: 1px solid var(--color-ice);
            border-left: 4px solid var(--color-primary);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.79rem;
            font-weight: 700;
            color: var(--color-heading);
            margin-bottom: 7px;
        }

        .output-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--color-heading);
            word-break: break-word;
        }

        .output-list li::before {
            content: "• ";
            font-weight: 800;
            color: var(--color-primary);
            margin-right: 4px;
        }

        .pie-filtro {
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid var(--color-border);
            font-size: 0.74rem;
            color: var(--color-text-muted);
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-word;
        }

        /* ============================ ESTADOS ============================ */
        .estado-vacio {
            max-width: 560px;
            margin: 60px auto;
            text-align: center;
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: 14px;
            padding: 32px 28px;
            box-shadow: var(--shadow-sm);
        }

        .estado-vacio h3 {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--color-heading);
            margin-bottom: 8px;
        }

        .estado-vacio p {
            font-size: 0.86rem;
            color: var(--color-text-muted);
        }

        .estado-vacio.error h3 {
            color: var(--color-error);
        }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid var(--color-ice);
            border-top-color: var(--color-primary);
            border-radius: 50%;
            margin: 0 auto 14px;
            animation: girar 0.9s linear infinite;
        }

        @keyframes girar {
            to { transform: rotate(360deg); }
        }

        [hidden] {
            display: none !important;
        }

        /* ============================ RESPONSIVE ============================ */
        .toolbar > *,
        .viewport > * {
            min-width: 0;
        }

        @media screen and (max-width: 1600px) {
            .toolbar {
                padding: 8px 14px;
            }

            .viewport {
                padding: 14px;
            }
        }

        @media screen and (max-width: 980px) {
            .toolbar {
                position: static;
            }

            .toolbar-left {
                width: 100%;
            }

            .btn-label-largo {
                display: none;
            }
        }

        @media screen and (max-width: 768px) {
            .toolbar-actions {
                width: 100%;
            }

            .grupo-enfoque {
                display: none;
            }

            .viewport {
                padding: 10px 8px;
            }

            .aviso {
                margin: 10px 8px 0;
            }
        }

        /* ============================ IMPRESIÓN / PDF ============================ */
        @media print {
            .toolbar,
            .aviso {
                display: none !important;
            }

            body {
                background: #FFFFFF;
            }

            .viewport {
                padding: 0;
                overflow: visible;
            }

            .sheet-wrap {
                width: auto !important;
                height: auto !important;
            }

            .diagram-sheet {
                position: static;
                transform: none !important;
                zoom: var(--zoom-impresion, 0.6);
            }

            .dimmed {
                opacity: 1 !important;
            }

            @page {
                size: landscape;
                margin: 8mm;
            }
        }
    </style>

    <!-- Hoja de estilos responsive compartida -->
    <link rel="stylesheet" href="Funciones/responsive.css?v=3">
</head>

<body>
    <!-- BARRA DE CONTROLES -->
    <div class="toolbar">
        <div class="toolbar-left">
            <span class="badge-sp">SQL · FLUJO</span>
            <span class="toolbar-title" id="toolbarTitulo">Visor de Stored Procedures</span>
            <span class="estado-pill" id="estadoPill" title="Origen del diagrama">
                <span class="estado-dot" id="estadoDot"></span>
                <span id="estadoTexto">Sin cargar</span>
            </span>
        </div>

        <div class="toolbar-actions">
            <span class="grupo-enfoque">
                <button class="btn active" id="btnAll" onclick="resaltarEtapa('all')">Vista Completa</button>
                <button class="btn" id="btnG1" onclick="resaltarEtapa('g1')">1. Fuentes</button>
                <button class="btn" id="btnG2" onclick="resaltarEtapa('g2')">2. Transformación</button>
                <button class="btn" id="btnG3" onclick="resaltarEtapa('g3')">3. Catálogos y Salida</button>
            </span>

            <span class="toolbar-sep"></span>

            <button class="btn" onclick="setZoom(zoom - 0.1)" title="Alejar">−</button>
            <span class="zoom-indicator" id="zoomLabel">100%</span>
            <button class="btn" onclick="setZoom(zoom + 0.1)" title="Acercar">+</button>
            <button class="btn" onclick="setZoom(1)">100%</button>
            <button class="btn" onclick="ajustarAncho()" title="Ajustar al ancho de la ventana">Ajustar</button>

            <span class="toolbar-sep"></span>

            <button class="btn" id="btnRegenerar" onclick="regenerarDesdeSql()" disabled
                title="Vuelve a leer el SP en SQL Server y regenera el diagrama con IA (DeepSeek / Gemini)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
                </svg>
                <span>Regenerar <span class="btn-label-largo">desde SQL</span></span>
            </button>
            <button class="btn btn-dark" onclick="exportarPdf()" title="Imprimir o guardar como PDF (horizontal)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
                    stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 6 2 18 2 18 9"></polyline>
                    <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
                    <rect x="6" y="14" width="12" height="8"></rect>
                </svg>
                <span>Exportar PDF</span>
            </button>
        </div>
    </div>

    <div class="aviso" id="aviso"></div>

    <div class="viewport" id="viewport">
        <!-- Estados: vacío / cargando / error -->
        <div class="estado-vacio" id="estadoPanel">
            <h3>Selecciona un Stored Procedure</h3>
            <p>Abre esta página desde <a href="Documentacion_SPs.html">Documentación de SPs</a> o agrega
                <code>?sp=NombreDelSP</code> (y opcionalmente <code>&amp;base=PlantasCore</code>) a la dirección.</p>
        </div>

        <div class="sheet-wrap" id="sheetWrap" hidden>
            <div class="diagram-sheet" id="diagramSheet"></div>
        </div>
    </div>

    <script>
        // =========================================================================
        // ⚙️ CONFIGURACIÓN DE CONEXIÓN HÍBRIDA A LA API .NET
        // =========================================================================
        const APP_CONFIG = {
            servidor: (typeof GLOBAL_CONFIG !== 'undefined' && GLOBAL_CONFIG.servidor)
                ? GLOBAL_CONFIG.servidor
                : "RAEVSALL001",
            puertos: (typeof GLOBAL_CONFIG !== 'undefined' && GLOBAL_CONFIG.puertos)
                ? GLOBAL_CONFIG.puertos
                : [8080, 5000]
        };

        function generarBasesApi() {
            if (typeof generarBasesApiGlobal === 'function') {
                return generarBasesApiGlobal();
            }
            const bases = [];
            for (const puerto of APP_CONFIG.puertos) {
                bases.push(`http://${APP_CONFIG.servidor}:${puerto}`);
            }
            return bases;
        }

        // Endpoint del controlador SpsController (catálogo; usado para detectar el servidor)
        APP_CONFIG.controllerPath = "/api/Sps/lista";
        APP_CONFIG.diagramaPath = "/api/Sps/diagrama";
        // La generación con IA puede tardar: timeout amplio para la carga del diagrama
        APP_CONFIG.timeoutMs = 240000;

        let apiBaseActiva = null;

        async function fetchConTimeout(url, timeoutMs = 10000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(id);
                return res;
            } catch (err) {
                clearTimeout(id);
                throw err;
            }
        }

        async function detectarServidorApi() {
            const bases = generarBasesApi();
            for (const base of bases) {
                try {
                    const res = await fetchConTimeout(`${base}${APP_CONFIG.controllerPath}`, 3500);
                    if (res.ok) return base;
                } catch (e) {
                    try {
                        const pingRes = await fetchConTimeout(`${base}/`, 2500);
                        if (pingRes.ok) return base;
                    } catch (errPing) { }
                }
            }
            return null;
        }

        // =========================================================================
        // 🗂️ ESTADO
        // =========================================================================
        const parametros = new URLSearchParams(window.location.search);
        const nombreSp = (parametros.get('sp') || '').trim();
        const baseDatos = (parametros.get('base') || '').trim();   // vacío = base predeterminada de la API
        let diagramaActual = null;
        let zoom = 1;
        let zoomManual = false;
        let etapaActiva = 'all';

        // =========================================================================
        // 🔧 UTILIDADES
        // =========================================================================
        function escaparHtml(texto) {
            return String(texto ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Texto seguro con realce: números (puntos, plantillas, SKUs) en negrita y `código` en monoespaciado
        function textoRico(texto) {
            return escaparHtml(texto)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/(^|[^\w#@.])(\d{2,})(?![\w])/g, '$1<strong>$2</strong>');
        }

        function lista(valor) {
            return Array.isArray(valor) ? valor : [];
        }

        function fechaLegible(iso) {
            if (!iso) return '-';
            const d = new Date(iso);
            if (isNaN(d)) return String(iso);
            const p = (n) => String(n).padStart(2, '0');
            return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        function fijarEstado(clase, texto) {
            document.getElementById('estadoDot').className = 'estado-dot' + (clase ? ` ${clase}` : '');
            document.getElementById('estadoTexto').textContent = texto;
        }

        function mostrarAviso(texto) {
            const aviso = document.getElementById('aviso');
            aviso.textContent = texto || '';
            aviso.classList.toggle('visible', !!texto);
        }

        function mostrarPanel(tipo, titulo, mensaje) {
            const panel = document.getElementById('estadoPanel');
            panel.hidden = false;
            panel.className = 'estado-vacio' + (tipo === 'error' ? ' error' : '');
            panel.innerHTML = `${tipo === 'cargando' ? '<div class="spinner"></div>' : ''}
                <h3>${escaparHtml(titulo)}</h3><p>${escaparHtml(mensaje)}</p>`;
            document.getElementById('sheetWrap').hidden = true;
        }

        // Avisa a la página contenedora (Documentacion_SPs.html) que el diagrama se cargó
        function notificarContenedor(datos) {
            try {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ tipo: 'sp-diagrama', nombre: nombreSp, base: baseDatos, ...datos }, '*');
                }
            } catch (_) { }
        }

        // =========================================================================
        // 🔄 CARGA DEL DIAGRAMA
        // =========================================================================
        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('resize', () => {
                if (!zoomManual) ajustarAncho(false);
                else dibujarConectores();
            });
            if (!nombreSp) return;
            document.title = `${nombreSp} · Flujo de Datos`;
            document.getElementById('toolbarTitulo').textContent = baseDatos ? `${baseDatos} · ${nombreSp}` : nombreSp;
            cargarDiagrama(false);
        });

        async function cargarDiagrama(forzar) {
            const btnRegenerar = document.getElementById('btnRegenerar');
            btnRegenerar.disabled = true;
            mostrarAviso('');
            fijarEstado('loading', forzar ? 'Regenerando…' : 'Consultando…');

            if (!diagramaActual || forzar) {
                mostrarPanel('cargando', forzar ? 'Regenerando el diagrama' : 'Cargando el diagrama',
                    forzar
                        ? 'Se lee el SP en SQL Server y la IA analiza el código. Puede tardar hasta un minuto.'
                        : 'Si el SP es nuevo o cambió en SQL Server, la IA lo analiza de nuevo y puede tardar hasta un minuto.');
            }

            try {
                if (!apiBaseActiva) {
                    apiBaseActiva = await detectarServidorApi();
                    if (!apiBaseActiva) {
                        throw new Error(`No se pudo conectar a ${APP_CONFIG.servidor} en puertos ${APP_CONFIG.puertos.join('/')}`);
                    }
                }

                const url = `${apiBaseActiva}${APP_CONFIG.diagramaPath}?nombre=${encodeURIComponent(nombreSp)}` +
                    `${baseDatos ? `&base=${encodeURIComponent(baseDatos)}` : ''}` +
                    `${forzar ? '&forzar=true' : ''}`;
                const res = await fetchConTimeout(url, APP_CONFIG.timeoutMs);
                let payload = null;
                try { payload = await res.json(); } catch (_) { }

                if (!res.ok || !payload || payload.exito === false || !payload.diagrama) {
                    throw new Error((payload && payload.mensaje) || `HTTP ${res.status}`);
                }

                diagramaActual = payload.diagrama;
                renderDiagrama(diagramaActual);

                const textos = {
                    cache: ['ok', `En caché · generado ${fechaLegible(payload.fechaGeneracion)}`],
                    ia: ['ok', `Generado ahora con ${payload.modelo || 'IA'}`],
                    gemini: ['ok', `Generado ahora con ${payload.modelo || 'Gemini'}`],
                    'cache-desactualizada': ['warn', `Desactualizado · generado ${fechaLegible(payload.fechaGeneracion)}`]
                };
                const [clase, texto] = textos[payload.origen] || ['ok', 'Cargado'];
                fijarEstado(clase, texto);

                if (payload.origen === 'cache-desactualizada') {
                    mostrarAviso(payload.advertencia ||
                        'El SP cambió en SQL Server después de generar este diagrama y no se pudo regenerar (no hay IA configurada). Se muestra la última versión guardada.');
                }

                notificarContenedor({ origen: payload.origen, fechaGeneracion: payload.fechaGeneracion });
            } catch (err) {
                console.error('Error al cargar el diagrama:', err);
                const mensaje = err.name === 'AbortError' ? 'La solicitud tardó demasiado y se canceló.' : err.message;
                fijarEstado('error', 'Error');
                if (diagramaActual) {
                    mostrarAviso(`No se pudo regenerar: ${mensaje}`);
                } else {
                    mostrarPanel('error', 'No se pudo cargar el diagrama', mensaje);
                }
                notificarContenedor({ origen: 'error' });
            } finally {
                btnRegenerar.disabled = false;
            }
        }

        function regenerarDesdeSql() {
            if (!nombreSp) return;
            cargarDiagrama(true);
        }

        // =========================================================================
        // 🖼️ RENDERIZADO DEL DIAGRAMA DESDE EL JSON
        // =========================================================================
        const ICONOS = {
            fuentes: `<svg width="38" height="38" viewBox="0 0 38 38" fill="none" aria-hidden="true">
                <ellipse cx="19" cy="9" rx="13" ry="4.5" fill="#5A77A8" stroke="#353A4C" stroke-width="1.8"/>
                <path d="M6 9V16C6 18.5 11.8 20.5 19 20.5C26.2 20.5 32 18.5 32 16V9" fill="#91A6C4" stroke="#353A4C" stroke-width="1.8"/>
                <path d="M6 16V23C6 25.5 11.8 27.5 19 27.5C26.2 27.5 32 25.5 32 23V16" fill="#C6D2E0" stroke="#353A4C" stroke-width="1.8"/>
                <path d="M6 23V30C6 32.5 11.8 34.5 19 34.5C26.2 34.5 32 32.5 32 30V23" fill="#E2E8F0" stroke="#353A4C" stroke-width="1.8"/></svg>`,
            transformacion: `<svg width="38" height="38" viewBox="0 0 38 38" fill="none" aria-hidden="true">
                <path d="M4 11H16M16 11L12 7M16 11L12 15" stroke="#353A4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M4 27H16M16 27L12 23M16 27L12 31" stroke="#353A4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M20 19H34M34 19L29 14M34 19L29 24" stroke="#5A77A8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            catalogos: `<svg width="42" height="38" viewBox="0 0 42 38" fill="none" aria-hidden="true">
                <ellipse cx="14" cy="9" rx="10" ry="3.8" fill="#5A77A8" stroke="#353A4C" stroke-width="1.6"/>
                <path d="M4 9V16C4 18 8.5 19.8 14 19.8C19.5 19.8 24 18 24 16V9" fill="#91A6C4" stroke="#353A4C" stroke-width="1.6"/>
                <path d="M4 16V23C4 25 8.5 26.8 14 26.8C19.5 26.8 24 25 24 23V16" fill="#C6D2E0" stroke="#353A4C" stroke-width="1.6"/>
                <path d="M4 23V30C4 32 8.5 33.8 14 33.8C19.5 33.8 24 32 24 30V23" fill="#E2E8F0" stroke="#353A4C" stroke-width="1.6"/>
                <circle cx="31" cy="24" r="6.5" fill="#748CAB" stroke="#353A4C" stroke-width="1.8"/>
                <circle cx="31" cy="24" r="2.2" fill="#FFFFFF" stroke="#353A4C" stroke-width="1.4"/></svg>`
        };

        function claseCabecera(estilo) {
            return ['primary', 'secondary', 'dark'].includes(estilo) ? estilo : 'dark';
        }

        // Título de sección en dos líneas: "1. Fuentes y Tabla Temporal (Desposte.dbo)" → salto antes del paréntesis
        function tituloSeccion(texto, porDefecto) {
            const t = escaparHtml(texto || porDefecto);
            return t.replace(/\s+\(/, '<br>(');
        }

        function htmlTarjetaFuente(t, indice) {
            const join = t.joinLabel && indice > 0
                ? `<div class="join-label grp-g1">${textoRico(t.joinLabel)}</div>` : '';
            const items = lista(t.items).map(i => `<li>${textoRico(i)}</li>`).join('');
            return `${join}
                <article class="node-card grp-g1" data-nodo="f${indice}">
                    <div class="card-head ${claseCabecera(t.estiloCabecera || (indice === 0 ? 'primary' : 'secondary'))}">${textoRico(t.titulo)}</div>
                    <div class="card-body">${items ? `<ul class="col-list">${items}</ul>` : ''}</div>
                </article>`;
        }

        function htmlTarjetaTransformacion(t, indice) {
            const sub = lista(t.subbloques).map(s => `
                <div class="sub-block">
                    ${s.subtitulo ? `<div class="sub-title"><span class="dash-accent"></span> ${textoRico(s.subtitulo)}</div>` : ''}
                    <ul class="bullet-list">${lista(s.bullets).map(b => `<li>${textoRico(b)}</li>`).join('')}</ul>
                </div>`).join('');
            const items = lista(t.items).length
                ? `<ul class="bullet-list">${lista(t.items).map(b => `<li>${textoRico(b)}</li>`).join('')}</ul>` : '';
            return `
                <article class="node-card grp-g2" data-nodo="t${indice}">
                    <div class="card-head ${claseCabecera(t.estiloCabecera || 'dark')}">${textoRico(t.titulo)}</div>
                    <div class="card-body">${sub}${items}</div>
                </article>`;
        }

        function htmlNodoCentral(n) {
            if (!n || (!n.titulo && !n.formula)) return '';
            // La fórmula se parte en líneas por los operadores para leerse como una cascada
            const formula = n.formula
                ? escaparHtml(n.formula).replace(/\s+([−\-+=])\s+/g, '<br>$1 ')
                    .replace(/(=\s*)([^<]+)$/, '$1<strong>$2</strong>')
                : '';
            return `
                <div class="balance-node grp-g2" data-nodo="hub">
                    <h4>${textoRico(n.titulo)}</h4>
                    ${n.descripcion ? `<p>${textoRico(n.descripcion)}</p>` : ''}
                    ${formula ? `<div class="formula-pill">${formula}</div>` : ''}
                </div>`;
        }

        function htmlCatalogos(e3) {
            const pasos = lista(e3.pasos).map((p, i) => `
                <div class="cat-paso">
                    <div class="cat-box" data-paso="${i}">${textoRico(p.caja)}</div>
                    ${p.detalle ? `<div class="cat-join-text">${textoRico(p.detalle)}</div>` : ''}
                    ${p.tipoJoin ? `<div class="join-tag">${textoRico(p.tipoJoin)}</div>` : ''}
                </div>`).join('');
            const badges = lista(e3.badges);
            return `
                <article class="node-card grp-g3" data-nodo="cat">
                    <div class="card-head dark">${textoRico(e3.tituloTarjeta || 'Consolidación y Catálogo')}</div>
                    <div class="card-body">
                        ${pasos}
                        ${badges.length ? `
                            <div class="niveles-list">
                                <h5>Niveles / Tipos resultantes</h5>
                                ${badges.map(b => `<span class="nivel-badge">${textoRico(b)}</span>`).join('')}
                            </div>` : ''}
                    </div>
                </article>`;
        }

        function htmlSalida(e4) {
            return `
                <article class="node-card grp-g3" data-nodo="out">
                    <div class="card-head dark">${textoRico(e4.tituloTarjeta || 'Resultado Final')}</div>
                    <div class="card-body">
                        <ul class="output-list">${lista(e4.columnas).map(c => `<li>${textoRico(c)}</li>`).join('')}</ul>
                        ${e4.pieFiltro ? `<div class="pie-filtro">${escaparHtml(e4.pieFiltro)}</div>` : ''}
                    </div>
                </article>`;
        }

        // 1) Inyecta el HTML de las 4 etapas · 2) mide las tarjetas · 3) traza los conectores
        function renderDiagrama(d) {
            const e1 = d.etapa1_fuentes || {};
            const e2 = d.etapa2_transformacion || {};
            const e3 = d.etapa3_catalogos || {};
            const e4 = d.etapa4_salida || {};
            const hub = htmlNodoCentral(e2.nodoCentral);

            const sheet = document.getElementById('diagramSheet');
            sheet.innerHTML = `
                <header class="sheet-header">
                    <div>
                        <h1>Esquema de Base de Datos y Flujo de Datos: ${escaparHtml(d.spName || nombreSp)}</h1>
                        ${d.subtitulo ? `<p>${escaparHtml(d.subtitulo)}</p>` : ''}
                    </div>
                    <div class="header-meta">
                        <div class="header-pill">${escaparHtml(d.badge || d.esquema || 'Desposte.dbo')}</div>
                        ${d.ultimaModificacion ? `<div class="header-fecha">SP modificado: ${escaparHtml(fechaLegible(d.ultimaModificacion))}</div>` : ''}
                    </div>
                </header>

                <div class="board" id="board">
                    <svg class="connectors-svg" id="connectors" xmlns="http://www.w3.org/2000/svg"></svg>
                    <svg class="connectors-svg frente" id="connectorsFrente" xmlns="http://www.w3.org/2000/svg"></svg>

                    <div class="sec-header s1 grp-g1" data-sec="1">
                        <div class="sec-icon">${ICONOS.fuentes}</div>
                        <h2>${tituloSeccion(e1.titulo, '1. Fuentes y Tablas Base')}</h2>
                    </div>
                    <div class="sec-header s2 grp-g2" data-sec="2">
                        <div class="sec-icon">${ICONOS.transformacion}</div>
                        <h2>${tituloSeccion(e2.titulo, '2. Transformación y Reglas')}</h2>
                    </div>
                    <div class="sec-header s3 grp-g3" data-sec="3">
                        <div class="sec-icon">${ICONOS.catalogos}</div>
                        <h2>${tituloSeccion(e3.titulo, '3. Catálogos y Salida')}</h2>
                    </div>

                    <div class="col col-1">${lista(e1.tarjetas).map(htmlTarjetaFuente).join('')}</div>
                    <div class="col col-2">${lista(e2.tarjetas).map(htmlTarjetaTransformacion).join('')}</div>
                    <div class="col col-hub">${hub}</div>
                    <div class="col col-3">${htmlCatalogos(e3)}</div>
                    <div class="col col-4">${htmlSalida(e4)}</div>
                </div>`;

            document.getElementById('estadoPanel').hidden = true;
            document.getElementById('sheetWrap').hidden = false;
            resaltarEtapa(etapaActiva);

            const terminar = () => {
                if (zoomManual) setZoom(zoom);
                else ajustarAncho(false);
            };
            terminar();
            // Las fuentes web cambian la altura de las tarjetas: se vuelve a medir al terminar de cargar
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(terminar);
        }

        // =========================================================================
        // ➰ CONECTORES ORTOGONALES (getBoundingClientRect, independiente del zoom)
        // =========================================================================
        const COLOR_LINEA = '#5A77A8';
        const COLOR_LINEA_SEC = '#748CAB';

        function medir(el, base) {
            const r = el.getBoundingClientRect();
            return {
                left: (r.left - base.left) / zoom,
                top: (r.top - base.top) / zoom,
                right: (r.right - base.left) / zoom,
                bottom: (r.bottom - base.top) / zoom,
                width: r.width / zoom,
                height: r.height / zoom,
                cx: ((r.left + r.right) / 2 - base.left) / zoom,
                cy: ((r.top + r.bottom) / 2 - base.top) / zoom
            };
        }

        function limitar(v, min, max) {
            return Math.min(Math.max(v, min), max);
        }

        function dibujarConectores() {
            const board = document.getElementById('board');
            const svg = document.getElementById('connectors');
            const svgFrente = document.getElementById('connectorsFrente');
            if (!board || !svg || !svgFrente) return;

            const base = board.getBoundingClientRect();
            const ancho = board.offsetWidth;
            const alto = board.offsetHeight;
            [svg, svgFrente].forEach(capa => {
                capa.setAttribute('width', ancho);
                capa.setAttribute('height', alto);
                capa.setAttribute('viewBox', `0 0 ${ancho} ${alto}`);
            });

            const q = (sel) => [...board.querySelectorAll(sel)].map(el => medir(el, base));
            const fuentes = q('.col-1 .node-card');
            const transf = q('.col-2 .node-card');
            const hubEl = board.querySelector('.balance-node');
            const hub = hubEl ? medir(hubEl, base) : null;
            const cat = q('.col-3 .node-card')[0];
            const out = q('.col-4 .node-card')[0];
            const secs = q('.sec-header');
            const pasos = q('.cat-box');

            const marcador = (id) => `<defs>
                <marker id="${id}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                    <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="${COLOR_LINEA}"/>
                </marker></defs>`;
            let html = marcador('flecha');
            let htmlFrente = marcador('flechaFrente');

            const linea = (d, color = COLOR_LINEA, grosor = 2.5, idMarcador = 'flecha') =>
                `<path d="${d}" stroke="${color}" stroke-width="${grosor}" fill="none" stroke-linejoin="round" marker-end="url(#${idMarcador})"/>`;

            // Ruta ortogonal de 90°: sale por la derecha del origen y entra por la izquierda del destino
            const ortogonal = (x1, y1, x2, y2, xBus) => {
                if (Math.abs(y1 - y2) < 1) return `M ${x1} ${y1} L ${x2 - 4} ${y2}`;
                return `M ${x1} ${y1} L ${xBus} ${y1} L ${xBus} ${y2} L ${x2 - 4} ${y2}`;
            };

            // Flechas entre los títulos de las etapas (1 → 2 → 3)
            for (let i = 0; i < secs.length - 1; i++) {
                const a = secs[i];
                const b = secs[i + 1];
                const x1 = a.right + 8;
                const x2 = b.left - 4;
                if (x2 - x1 > 12) html += linea(`M ${x1} ${a.cy} L ${x2} ${a.cy}`);
            }

            // Etapa 1: cadena vertical entre las fuentes
            for (let i = 0; i < fuentes.length - 1; i++) {
                const a = fuentes[i];
                const b = fuentes[i + 1];
                html += linea(`M ${a.cx} ${a.bottom} L ${a.cx} ${b.top - 4}`);
            }

            // Etapa 1 → Etapa 2: la última fuente alimenta cada bloque de transformación
            const ultimaFuente = fuentes[fuentes.length - 1];
            const destinosE2 = transf.length ? transf : (hub ? [hub] : (cat ? [cat] : []));
            if (ultimaFuente && destinosE2.length) {
                const xBus = ultimaFuente.right + 30;
                destinosE2.forEach(t => {
                    // Línea recta si la fuente queda a la altura del destino; si no, entra por su parte alta
                    const alineado = ultimaFuente.cy > t.top + 22 && ultimaFuente.cy < t.bottom - 22;
                    const y2 = alineado ? ultimaFuente.cy : t.top + Math.min(t.height / 2, 60);
                    html += linea(ortogonal(ultimaFuente.right, ultimaFuente.cy, t.left, y2, xBus));
                });
            }

            // Etapa 2 → nodo central → catálogos
            const destinoE2 = hub || cat;
            if (transf.length && destinoE2) {
                const xBus = Math.max(...transf.map(t => t.right)) + (hub ? 26 : 32);
                const yDestino = limitar(hub ? hub.cy : transf[0].cy, destinoE2.top + 24, destinoE2.bottom - 24);
                transf.forEach(t => {
                    html += linea(ortogonal(t.right, t.cy, destinoE2.left, yDestino, xBus));
                });
            }

            if (hub && cat) {
                const y = limitar(hub.cy, cat.top + 24, cat.bottom - 24);
                html += linea(ortogonal(hub.right, hub.cy, cat.left, y, hub.right + 26));
            }

            // Catálogos → Resultado final
            if (cat && out) {
                const yBase = hub ? hub.cy : cat.top + Math.min(cat.height / 2, 200);
                const y1 = limitar(yBase, cat.top + 24, cat.bottom - 24);
                const y2 = limitar(y1, out.top + 24, out.bottom - 24);
                html += linea(ortogonal(cat.right, y1, out.left, y2, cat.right + 32));
            }

            // Flechas internas entre los pasos del catálogo (DatasetFinal → Articulo_Codigo_Corto → …)
            for (let i = 0; i < pasos.length - 1; i++) {
                const a = pasos[i];
                const b = pasos[i + 1];
                const x = a.left + 20;
                htmlFrente += linea(`M ${x} ${a.bottom} L ${x} ${b.top - 4}`, COLOR_LINEA_SEC, 2.2, 'flechaFrente');
            }

            svg.innerHTML = html;
            svgFrente.innerHTML = htmlFrente;
        }

        // =========================================================================
        // 🔍 ZOOM, ENFOQUE POR ETAPA E IMPRESIÓN
        // =========================================================================
        function aplicarTamanoHoja() {
            const sheet = document.getElementById('diagramSheet');
            const wrap = document.getElementById('sheetWrap');
            sheet.style.transform = `scale(${zoom})`;
            wrap.style.width = `${sheet.offsetWidth * zoom}px`;
            wrap.style.height = `${sheet.offsetHeight * zoom}px`;
            document.getElementById('zoomLabel').textContent = `${Math.round(zoom * 100)}%`;
        }

        function setZoom(valor, manual = true) {
            zoom = Math.min(1.5, Math.max(0.55, +Number(valor).toFixed(2)));
            if (manual) zoomManual = true;
            if (!diagramaActual) {
                document.getElementById('zoomLabel').textContent = `${Math.round(zoom * 100)}%`;
                return;
            }
            aplicarTamanoHoja();
            dibujarConectores();
            aplicarTamanoHoja();   // La altura puede cambiar al dibujar: se reajusta el contenedor
        }

        // Ajusta el zoom al ancho disponible (máximo 100%)
        function ajustarAncho(manual = true) {
            const sheet = document.getElementById('diagramSheet');
            const viewport = document.getElementById('viewport');
            if (!sheet || !diagramaActual) return;
            const estilos = getComputedStyle(viewport);
            const disponible = viewport.clientWidth - parseFloat(estilos.paddingLeft) - parseFloat(estilos.paddingRight);
            const objetivo = Math.min(1, disponible / sheet.offsetWidth);
            zoomManual = false;
            setZoom(objetivo, false);
            if (manual) zoomManual = false;
        }

        function resaltarEtapa(grupo) {
            etapaActiva = grupo;
            const botones = { all: 'btnAll', g1: 'btnG1', g2: 'btnG2', g3: 'btnG3' };
            Object.entries(botones).forEach(([clave, id]) =>
                document.getElementById(id)?.classList.toggle('active', clave === grupo));

            document.querySelectorAll('#diagramSheet .sec-header, #diagramSheet .node-card, #diagramSheet .balance-node, #diagramSheet .join-label')
                .forEach(el => el.classList.toggle('dimmed', grupo !== 'all' && !el.classList.contains(`grp-${grupo}`)));
        }

        // El PDF se imprime en horizontal; el factor de escala hace caber el ancho del diagrama en la hoja
        function exportarPdf() {
            if (!diagramaActual) {
                window.print();
                return;
            }
            const sheet = document.getElementById('diagramSheet');
            const anchoHojaPx = 1060;  // A4 horizontal menos márgenes, aprox. a 96 dpi
            const factor = Math.min(1, anchoHojaPx / sheet.offsetWidth);
            sheet.style.setProperty('--zoom-impresion', factor.toFixed(3));
            window.print();
        }
    </script>
</body>

</html>
